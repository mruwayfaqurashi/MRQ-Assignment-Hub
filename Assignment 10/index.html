<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css">
  
</head>
<body>

  <div class="site">
    <header class="header">
      <a class="logo" href="#">Photon</a>

      <nav class="nav">
        <a href="#" class="nav-link">Home</a>
        <!-- Gallery dropdown -->
        <div class="nav-item gallery-menu">
          <a href="#" class="nav-link">
            Gallery <span class="arrow-down">˅</span>
          </a>

          <div class="dropdown">
            <a href="#">Nature</a>
            <a href="#">Portrait</a>
            <a href="#">People</a>
            <a href="#">Architecture</a>
            <a href="#">Animals</a>
            <a href="#">Sports</a>
            <a href="#">Travel</a>

            <div class="submenu-wrapper">
              <a href="#" class="submenu-title">
                Sub Menu <span>›</span>
              </a>

              <div class="submenu">
                <a href="#">Menu One</a>
                <a href="#">Menu Two</a>
                <a href="#">Menu Three</a>
              </div>
            </div>
          </div>
        </div>

        <a href="#" class="nav-link">Services</a>
        <a href="#" class="nav-link">Blog</a>
        <a href="#" class="nav-link">About</a>
        <a href="#" class="nav-link">Reviews</a>
      </nav>

      <div class="socials">
      <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
      <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" aria-label="Youtube"><i class="fa-brands fa-youtube"></i></a>
    </div>
    </header>

    <main class="hero-grid">
      

      <article class="photo-card nature">
        <div class="overlay"></div>
        <div class="card-content">
          <h2>Nature</h2>
          <a href="#" class="button">MORE PHOTOS</a>
        </div>
      </article>
      

      <article class="photo-card portrait">
        <div class="overlay"></div>
        <div class="card-content">
          <h2>Portrait</h2>
          <a href="#" class="button">MORE PHOTOS</a>
        </div>
      </article>

      <article class="photo-card people">
        <div class="overlay"></div>
        <div class="card-content">
          <h2>People</h2>
          <a href="#" class="button">MORE PHOTOS</a>
        </div>
      </article>
      
<a class="right-arrow" href="#">→</a>
<a class="left-arrow" href="#">←</a>     

<div class="dots">
          <span class="selected"></span>
          <span></span><span></span><span></span><span></span>
        </div>
    </main>

    <footer class="footer">
      Copyright ©2018 All rights reserved | This template is made with ♡ by
      <a href="#">Colorlib</a>
    </footer>
  </div>

</body>
</html>
