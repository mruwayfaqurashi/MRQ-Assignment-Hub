<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid System layout</title>
  <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    height: 100vh;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    grid-template-rows: repeat(12, 1fr);
}

.container div {
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
}

.box1 {
    grid-row: span 1;
    grid-column: span 1;
    background-color: #000;
    order: 1;
}


.box2 {
    grid-row: span 1;
    grid-column: span 3;
    background-color: #ff0000;
    order: 2;
}

.box3 {
    grid-row: span 5;
    grid-column: span 4;
    background-color: hwb(197 33% 6%);
    order: 3;
}

.box4 {
    grid-row: span 4;
    grid-column: span 2;
    background-color: #221c35;
    order: 4;
}

.box5 {
    grid-row: span 4;
    grid-column: span 1;
    background-color: transparent;
    order: 5;
}

.box6 {
    grid-column: span 1;
    grid-row: span 2;
    background-color: #74eb74;
    order: 6;
}

.box7 {
    grid-column: span 1;
    grid-row: span 2;
    background-color: #11b411;
    order: 7;
}

.box8 {
    grid-row: span 2;
    grid-column: span 4;
    color: #000 !important;
    background-color: #ffb20b;
    order: 8;
}

@media screen and (max-width: 1000px) {
    .box1 {
        grid-column: span 4;
    }

    .box2 {
        order: 3;
        grid-column: span 1;
        grid-row: span 8;

    }

    .box3 {
        order: 2;
    }

    .box5 {
        display: none !important;
    }

    .box4 {
        grid-column: span 3;

    }

    .box6 {
        order: 8;
    }

    .box7 {
        order: 7;
        grid-column: span 2;
    }

    .box8 {
        order: 6;
        grid-column: span 3;
        grid-row: span 1;
    }
}



@media screen and (max-width: 570px) {
    .box2 {
        order: 2;
        grid-row: span 1;
        grid-column: span 4;
    }

    .box3 {
        order: 3;
        grid-row: span 4;
    }

    .box4 {
        grid-column: span 4;
        grid-row: span 3;
    }

    .box8 {
        grid-column: span 4;
    }

    .box7 {
        grid-column: span 4;
        grid-row: span 1;
    }

    .box6 {
        grid-column: span 4;
    }
  }
  </style>
</head>
<body>
    <div class="container">
        <div class="box1">HEADER</div>
        <div class="box2">MENU</div>
        <div class="box3">HERO</div>
        <div class="box4">MAIN</div>
        <div class="box5"></div>
        <div class="box6">IMAGE</div>
        <div class="box7">EXTRA</div>
        <div class="box8">BANNER</div>
    </div>
</body>
</html>
