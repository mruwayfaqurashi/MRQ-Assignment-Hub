<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shadcnblocks Navbar</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       NAVBAR
    ========================= */

    .navbar {
      width: 100%;
      height: 297px;

      display: flex;
      align-items: flex-end;

      padding: 116px 122px 112px;
    }


    /* =========================
       NAVBAR CONTENT
    ========================= */

    .nav-container {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      height: 50px;
      border-bottom:1px solid #d0d0d0 ;
    }


    /* =========================
       LOGO
    ========================= */

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;

      color: #111;
      text-decoration: none;

      font-size: 12px;
      font-weight: 600;
    }

    .brand-icon {
      width: 17px;
      height: 17px;

      position: relative;

      background: #111;

      clip-path: polygon(
        50% 0%,
        100% 27%,
        100% 73%,
        50% 100%,
        0% 73%,
        0% 27%
      );
    }

    .brand-icon::after {
      content: "";

      position: absolute;

      width: 8px;
      height: 8px;

      top: 4.5px;
      left: 4.5px;

      background: #fff;

      clip-path: polygon(
        50% 0%,
        100% 27%,
        100% 73%,
        50% 100%,
        0% 73%,
        0% 27%
      );
    }


    /* =========================
       CENTER NAVIGATION
    ========================= */

    .nav-links {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 32px;

      list-style: none;
    }

    .nav-links a {
      display: flex;
      align-items: center;
      gap: 5px;

      color: #111;

      text-decoration: none;

      font-size: 10px;
      font-weight: 400;

      white-space: nowrap;
    }

    .nav-links a:hover {
      opacity: 0.6;
    }


    /* =========================
       DROPDOWN ARROW
    ========================= */

    .arrow {
      width: 5px;
      height: 5px;

      border-right: 1px solid #555;
      border-bottom: 1px solid #555;

      transform: rotate(45deg) translateY(-2px);
    }


    /* =========================
       RIGHT SIDE
    ========================= */

    .actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .login {
      color: #111;

      text-decoration: none;

      font-size: 10px;
    }

    .login:hover {
      opacity: 0.6;
    }

    .signup {
      display: flex;
      align-items: center;
      justify-content: center;

      height: 24px;

      padding: 0 12px;

      border-radius: 4px;

      background: #171717;
      color: #fff;

      text-decoration: none;

      font-size: 10px;
      font-weight: 500;

      transition: background 0.2s ease;
    }

    .signup:hover {
      background: #333;
    }

    #switch
      {
    position: absolute;
    top: 20px;              
    padding: 10px 18px;
    background-color: #ffffff25;
    color: white;
    text-decoration: none;
    font-weight: bold;
    border-radius: 6px;
    font-family: sans-serif;
    font-size: 14px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    z-index: 1000;
    right: 20px;
    }
    #switch:hover {
    background-color: #000;
}

#switch a{
    text-decoration: none;
    color: #000;
}

#switch a:hover{
    color: #fff;
}

  </style>
</head>

<body>

  <nav class="navbar">

    <div class="nav-container">

      <!-- Logo -->
      <a href="#" class="brand">

        <span class="brand-icon"></span>

        <span>Shadcnblocks.com</span>

      </a>


      <!-- Center Navigation -->
      <ul class="nav-links">

        <li>
          <a href="#">
            Products
            <span class="arrow"></span>
          </a>
        </li>

        <li>
          <a href="#">
            Company
            <span class="arrow"></span>
          </a>
        </li>

        <li>
          <a href="#">
            Contact
          </a>
        </li>

      </ul>


      <!-- Right Actions -->
      <div class="actions">

        <a href="#" class="login">
          Log in
        </a>

        <a href="#" class="signup">
          Sign up
        </a>

      </div>

    </div>

  </nav>

<div>
<button id="switch"><a href="index2.html">Next page →</a></button>
</div>

</body>
</html>
