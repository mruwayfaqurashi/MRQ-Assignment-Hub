<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Glass Navbar</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(48, 130, 255, 0.65),
          transparent 35%
        ),
        radial-gradient(
          circle at 82% 78%,
          rgba(104, 40, 180, 0.45),
          transparent 38%
        ),
        linear-gradient(135deg, #071a50, #0b1747 50%, #050d35);
      color: white;
      overflow-x: hidden;
    }

    /* -------------------------
       Page Heading
    ------------------------- */

    .hero {
      text-align: center;
      padding-top: 50px;
    }

    .hero h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      letter-spacing: -1.5px;
    }

    /* -------------------------
       Navbar
    ------------------------- */

    .navbar {
      width: min(960px, calc(100% - 40px));
      height: 86px;
      margin: 135px auto 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 30px;

      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 20px;

      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 20px 50px rgba(0, 0, 0, 0.12);
    }

    /* Logo */

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;

      font-size: 21px;
      font-weight: 700;
      color: white;
      text-decoration: none;
    }

    .logo-dot {
      width: 29px;
      height: 29px;
      border-radius: 50%;

      background: linear-gradient(
        135deg,
        #39c8ff,
        #6678f5
      );

      box-shadow: 0 0 20px rgba(60, 185, 255, 0.3);
    }

    /* Navigation links */

    .nav-links {
      display: flex;
      align-items: center;
      gap: 38px;
      list-style: none;
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.82);
      text-decoration: none;
      font-size: 17px;

      transition: color 0.25s ease;
    }

    .nav-links a:hover {
      color: white;
    }

    /* Sign up */

    .signup {
      border: none;
      padding: 15px 27px;

      border-radius: 13px;

      color: white;
      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      background: linear-gradient(
        135deg,
        #35c5f8,
        #7685ef
      );

      box-shadow:
        0 8px 20px rgba(51, 170, 255, 0.22);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .signup:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 25px rgba(51, 170, 255, 0.35);
    }

    /* -------------------------
       Hamburger
    ------------------------- */

    .menu-button {
      display: none;

      width: 42px;
      height: 42px;

      border: none;
      background: transparent;

      cursor: pointer;

      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .menu-button span {
      width: 35px;
      height: 3px;

      border-radius: 5px;
      background: white;

      transition: 0.3s ease;
    }

    #switch
      {
    position: absolute;
    top: 20px;              
    padding: 10px 18px;
    background-color: #ffffff25;
    color: white;
    text-decoration: none;
    font-weight: bold;
    border-radius: 6px;
    font-family: sans-serif;
    font-size: 14px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    z-index: 1000;
    left: 20px;
    }
    #switch:hover {
    background-color: #ffff;
    color: #6678f5;
}

    /* -------------------------
       Mobile
    ------------------------- */

    @media (max-width: 700px) {

      .hero {
        padding-top: 35px;
      }

      .hero h1 {
        padding: 0 20px;
      }

      .navbar {
        width: min(420px, calc(100% - 40px));
        height: 76px;

        margin-top: 100px;
        padding: 0 28px;

        border-radius: 18px;
      }

      .nav-links,
      .signup {
        display: none;
      }

      .menu-button {
        display: flex;
      }

      .logo {
        font-size: 19px;
      }

      .logo-dot {
        width: 27px;
        height: 27px;
      }
    }

    
  </style>
</head>

<body>

  <!-- Heading -->
  <header class="hero">
    <h1>
    CSS Responsive Navbar Design
    </h1>
  </header>


  <!-- Desktop / Mobile Navbar -->
  <nav class="navbar">

    <!-- Logo -->
    <a href="#" class="logo">
      <span class="logo-dot"></span>
      <span>Flow</span>
    </a>


    <!-- Desktop Links -->
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Product</a></li>
      <li><a href="#">Docs</a></li>
      <li><a href="#">Blog</a></li>
    </ul>


    <!-- Desktop Button -->
    <button class="signup">
      Sign up
    </button>


    <!-- Mobile Hamburger -->
    <button
      class="menu-button"
      id="menuButton"
      aria-label="Open menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </nav>

<button><a id="switch" href="index2.html">← Previous Page</a></button>

</body>
</html>
