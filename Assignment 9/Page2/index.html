<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<button id="switch"><a href="../Page1/index.html">← Previous Page</a></button>
  <div class="container">

    
    <section class="login-section">

      <h1>Sign in</h1>

    <div class="social-buttons">
    <a href="" class="social facebook"><i class="fa-brands fa-facebook-f"></i></a>
    <a href="" class="social google"><i class="fa-brands fa-google-plus-g"></i></a>
    <a href="" class="social linkedin"><i class="fa-brands fa-linkedin-in"></i></a>
    </div>

      <p class="or-text">
        or use your account
      </p>

      <form class="login-form">

        <input
          type="email"
          placeholder="Email"
        >

        <input
          type="password"
          placeholder="Password"
        >

        <a href="#" class="forgot">
          Forgot your password?
        </a>

        <button type="submit" class="signin-btn">
          SIGN IN
        </button>

      </form>

    </section>


    
    <section class="signup-section">

      <h2>Hello, Friend!</h2>

      <p>
        Enter your personal details and start<br>
        journey with us
      </p>

      <button class="signup-btn">
        SIGN UP
      </button>

    </section>

  </div>

</body>
</html>
